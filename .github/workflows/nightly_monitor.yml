# .github/workflows/nightly_monitor.yml
# 作用：每天北京时间 6:50 自动执行 Web 监控全流程（cron 设为 UTC 22:50）
# 触发方式：schedule 定时 + workflow_dispatch 手动触发
# 依赖：Node.js 18、Python 3.11、Playwright Chromium
# 环境变量：FEISHU_WEBHOOK_URL、LLM_API_KEY（需在 GitHub Secrets 中配置）

name: Nightly Web Monitor

on:
  # 推送代码到 master 分支时触发
  push:
    branches: [ "master" ]

  # 定时触发：UTC 23:00（北京时间次日7.）
  schedule:
    - cron: '0 23 * * *'

  # 手动触发（用于测试和调试）
  workflow_dispatch:

# 环境变量（全局可用）
env:
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
  DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}

# gh-pages 分支部署权限（Allure 报告托管）
# 说明：原 actions/deploy-pages 工作流部署方式出现服务侧异常（pages/builds 始终为空、站点 404），
# 改为直接向 gh-pages 分支推送报告，需要 contents: write
permissions:
  contents: write

jobs:
  monitor:
    # 使用 Ubuntu 最新 LTS 版本
    runs-on: ubuntu-latest

    # 超时时间：整个 job 最长 30 分钟
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 18（LTS）
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'   # 缓存 node_modules，加速后续运行

      # 3. 设置 Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # 缓存 pip 包

      # 4. 安装 Node.js 依赖
      - name: Install Node.js dependencies
        run: npm ci   # 比 npm install 更快更可靠（需要 package-lock.json）

      # 5. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 安装 Playwright 浏览器（Chromium）
      #    --with-deps 会自动安装系统依赖库
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 7. 验证 Playwright 安装
      - name: Verify Playwright installation
        run: npx playwright --version

      # 8. 运行主监控脚本
      #    注意：脚本会调用 LLM API，需要网络连通
      - name: Run Web Monitor
        id: run_monitor
        run: python scripts/run_monitor.py
        # 即使脚本返回非零退出码，也继续执行后续步骤（上传 artifact）
        continue-on-error: true
        env:
          # 飞书卡片"查看详细测试报告"按钮指向的 GitHub Pages 报告地址
          # ⚠️ Pages 站点 URL 保留仓库名原始大小写：小写地址会 404
          ALLURE_REPORT_URL: https://zhaoguoy.github.io/Test_ai-agent_project02/

      # 9. 生成 Allure 静态报告（合并全量结果与自愈重跑结果）
      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p workspace/allure-results workspace/allure-heal-results
          npx allure generate workspace/allure-results workspace/allure-heal-results -o workspace/allure-report --clean
        continue-on-error: true

      # 10. 上传测试报告（JUnit XML + HTML + Allure）
      #    即使测试失败，报告也应保留以供分析
      - name: Upload test reports
        if: always()   # 无论前一步成功与否都执行
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            workspace/test-results/
            workspace/logs/
            workspace/allure-report/
          retention-days: 7   # 保留 7 天

      # 11. 部署 Allure 报告到 gh-pages 分支（供飞书卡片按钮跳转查看）
      #     原 Setup Pages / Upload Pages artifact / deploy-pages 三件套因 GitHub Pages
      #     服务侧构建管道异常（builds 始终为空）已废弃，改为直接推送 gh-pages 分支
      - name: Deploy Allure report to gh-pages
        if: always()
        run: |
          set -e
          REPORT_DIR=workspace/allure-report
          if [ ! -f "$REPORT_DIR/index.html" ]; then
            echo "⚠️ Allure 报告中缺少 index.html，跳过部署"
            exit 0
          fi
          cd "$REPORT_DIR"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Allure report (run ${{ github.run_id }})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
          echo "✅ 报告已部署: https://zhaoguoy.github.io/Test_ai-agent_project02/"

      # 12. 输出执行结果（便于在 Actions 日志中查看）
      - name: Print execution status
        if: always()
        run: |
          echo "Exit code: ${{ steps.run_monitor.outputs.exit-code }}"
          echo "Run ID: ${{ github.run_id }}"
