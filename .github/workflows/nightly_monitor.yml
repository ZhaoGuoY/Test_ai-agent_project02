# .github/workflows/nightly_monitor.yml
# 作用：每天 UTC 6:00（北京时间 14:00）自动执行 Web 监控全流程
# 触发方式：schedule 定时 + workflow_dispatch 手动触发
# 依赖：Node.js 18、Python 3.11、Playwright Chromium
# 环境变量：FEISHU_WEBHOOK_URL、LLM_API_KEY（需在 GitHub Secrets 中配置）

name: Nightly Web Monitor

on:
  # 定时触发：每天 UTC 6:00（北京时间 14:00）
  schedule:
    - cron: '0 6 * * *'

  # 手动触发（用于测试和调试）
  workflow_dispatch:

# 环境变量（全局可用）
env:
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  monitor:
    # 使用 Ubuntu 最新 LTS 版本
    runs-on: ubuntu-latest

    # 超时时间：整个 job 最长 30 分钟
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 18（LTS）
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'   # 缓存 node_modules，加速后续运行

      # 3. 设置 Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # 缓存 pip 包

      # 4. 安装 Node.js 依赖
      - name: Install Node.js dependencies
        run: npm ci   # 比 npm install 更快更可靠（需要 package-lock.json）

      # 5. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 安装 Playwright 浏览器（Chromium）
      #    --with-deps 会自动安装系统依赖库
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 7. 验证 Playwright 安装
      - name: Verify Playwright installation
        run: npx playwright --version

      # 8. 运行主监控脚本
      #    注意：脚本会调用 LLM API，需要网络连通
      - name: Run Web Monitor
        id: run_monitor
        run: python scripts/run_monitor.py
        # 即使脚本返回非零退出码，也继续执行后续步骤（上传 artifact）
        continue-on-error: true

      # 9. 上传测试报告（JUnit XML + HTML）
      #    即使测试失败，报告也应保留以供分析
      - name: Upload test reports
        if: always()   # 无论前一步成功与否都执行
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            workspace/test-results/
            workspace/logs/
          retention-days: 7   # 保留 7 天

      # 10. 输出执行结果（便于在 Actions 日志中查看）
      - name: Print execution status
        if: always()
        run: |
          echo "Exit code: ${{ steps.run_monitor.outputs.exit-code }}"
          echo "Run ID: ${{ github.run_id }}"