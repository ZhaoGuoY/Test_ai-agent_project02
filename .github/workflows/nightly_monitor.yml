# .github/workflows/nightly_monitor.yml
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# 作用：每天自动执行 Web 监控全流程
# 定时策略：cron 使用 UTC 时间。UTC 07:10 对应北京时间 15:10，
#           该时段处于美国深夜低负载期，调度延迟远小于早高峰，无需提前补偿。
# 触发方式：schedule 定时 + workflow_dispatch 手动触发
# 依赖：Node.js 18、Python 3.11、Playwright Chromium
# 环境变量：FEISHU_WEBHOOK_URL、LLM_API_KEY（需在 GitHub Secrets 中配置）

name: Nightly Web Monitor

on:
  # 推送代码到 master 分支时触发
  push:
    branches: [ "master" ]

  # 定时触发：UTC 07:10 = 北京时间 15:10；
  # ⚠️ GitHub schedule 仅在默认分支（master）上的工作流文件生效，勿只改其他分支。
  schedule:
  - cron: '10 7 * * *'

  # 手动触发（用于测试和调试）
  workflow_dispatch:

# 环境变量（全局可用）
env:
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
  DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}

# gh-pages 分支部署权限（Allure 报告托管）
# 说明：原 actions/deploy-pages 工作流部署方式出现服务侧异常（pages/builds 始终为空、站点 404），
# 改为直接向 gh-pages 分支推送报告，需要 contents: write
permissions:
  contents: write

jobs:
  monitor:
    # 使用 Ubuntu 最新 LTS 版本
    runs-on: ubuntu-latest

    # 超时时间：整个 job 最长 40 分钟（支持 3 轮重试 + 余量）
    timeout-minutes: 40

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 18（LTS）
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'   # 缓存 node_modules，加速后续运行

      # 3. 设置 Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # 缓存 pip 包

      # 4. 安装 Node.js 依赖
      - name: Install Node.js dependencies
        run: npm ci   # 比 npm install 更快更可靠（需要 package-lock.json）

      # 5. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 安装 Playwright 浏览器（Chromium）
      #    --with-deps 会自动安装系统依赖库
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 7. 验证 Playwright 安装
      - name: Verify Playwright installation
        run: npx playwright --version

      # 8. 运行测试（只重试不修改脚本）
      #    使用 Playwright 原生 retries=3，不调用自愈逻辑
      - name: Run Playwright Tests (retry only)
        id: run_tests
        run: npx playwright test --retries=3
        continue-on-error: true
        env:
          # 飞书卡片"查看详细测试报告"按钮指向的 GitHub Pages 报告地址
          # ⚠️ Pages 站点 URL 保留仓库名原始大小写：小写地址会 404
          ALLURE_REPORT_URL: https://zhaoguoy.github.io/Test_ai-agent_project02/

      # 9. 生成 Allure 静态报告
      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p workspace/allure-results
          npx allure generate workspace/allure-results -o workspace/allure-report --clean
        continue-on-error: true

      # 10. 上传测试报告（JUnit XML + HTML + Allure）
      #    即使测试失败，报告也应保留以供分析
      - name: Upload test reports
        if: always()   # 无论前一步成功与否都执行
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            workspace/test-results/
            workspace/logs/
            workspace/allure-report/
          retention-days: 7   # 保留 7 天

      # 11. 部署 Allure 报告到 gh-pages 分支（供飞书卡片按钮跳转查看）
      #     原 Setup Pages / Upload Pages artifact / deploy-pages 三件套因 GitHub Pages
      #     服务侧构建管道异常（builds 始终为空）已废弃，改为直接推送 gh-pages 分支。
      #     使用孤儿提交 + 常规 push：只保留最新一份报告，同时避免 --force 覆写整个分支历史。
      - name: Deploy Allure report to gh-pages
        if: always()
        run: |
          set -e
          REPORT_DIR=workspace/allure-report
          if [ ! -f "$REPORT_DIR/index.html" ]; then
            echo "️ Allure 报告中缺少 index.html，跳过部署"
            exit 0
          fi
          # 清理大附件（.zip/.png），避免超过 GitHub 100MB 推送限制
          # 这些文件通常是 Playwright trace 或截图，对报告核心功能非必需
          find "$REPORT_DIR/data/attachments" -type f \( -name "*.zip" -o -name "*.png" \) -delete 2>/dev/null || true
          echo "✅ 已清理大附件，准备部署报告"
          cd "$REPORT_DIR"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 孤儿提交：不携带任何历史，每次部署仅包含最新报告内容，控制分支体积
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy Allure report (run ${{ github.run_id }})"
          # 常规 push：远端不存在该分支时自动创建；存在时以孤儿提交续接，不覆写历史。
          # 若推送因远端状态异常失败，回退为强制推送，保证部署步骤不因历史问题阻塞。
          if ! git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages; then
            echo "⚠️ 常规推送失败，回退为强制推送"
            git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
          fi
          echo "✅ 报告已部署: https://zhaoguoy.github.io/Test_ai-agent_project02/"

      # 12. 发送飞书通知
      - name: Send Feishu notification
        if: always()
        run: python scripts/send_feishu_notification.py
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ALLURE_REPORT_URL: https://zhaoguoy.github.io/Test_ai-agent_project02/
        continue-on-error: true

      # 13. 输出执行结果（便于在 Actions 日志中查看）
      - name: Print execution status
        if: always()
        run: |
          echo "Run ID: ${{ github.run_id }}"
