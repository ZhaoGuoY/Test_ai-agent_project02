# config/settings.yaml
# 作用：集中管理所有配置项，避免硬编码
# 后续增量会通过 src/core/config_loader.py 读取此文件
#YAML 数据和 playwright.config.ts 完全一致，语法正确。 唯一要注意的是 ${VAR} 占位符需要代码层面处理

# 目标测试网站（三站点分离架构：每个站点独立 spec 文件，故障隔离）
target:
  sites:
    - name: US
      url: "https://www.makera.com/products/carvera"
    - name: EU
      url: "https://eu.makera.com/products/carvera-air"
    - name: Global
      url: "https://global.makera.com/products/makera-z1-desktop-cnc"
  title_contains: "Makera"   # 用于增量1冒烟测试断言

# Playwright 相关配置
playwright:
  browser: chromium
  headless: true
  timeout: 30000
  test_dir: "./src/web/testcases"
  output_dir: "./workspace/test-results"

# 飞书机器人配置（增量1使用）
# 请将 FEISHU_WEBHOOK_URL 配置到 .env 文件或系统环境变量中
feishu:
  webhook_url: "${FEISHU_WEBHOOK_URL}"   # 从环境变量读取，避免泄露

# LLM 配置（增量3使用）
llm:
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"