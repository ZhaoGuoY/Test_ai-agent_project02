# Gitee Go CI/CD 配置（等价于 nightly_monitor.yml）
# 每天 UTC 0:00（北京时间 8:00）自动执行 Web 监控
# 环境变量需在 Gitee 仓库设置中添加：FEISHU_WEBHOOK_URL、DEEPSEEK_API_KEY

version: '1.0'
name: nightly-monitor
displayName: Nightly Web Monitor

triggers:
  cron:
    - cron: '0 0 * * *'
      branches: ['*']
  manual: true

stages:
  - name: monitor
    displayName: 监控执行
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: install-node-deps
        displayName: 安装 Node.js 依赖
        nodeVersion: 18.0.0
        commands:
          - npm ci

      - step: build@python
        name: install-python-deps
        displayName: 安装 Python 依赖
        pythonVersion: 3.11.0
        commands:
          - python -m pip install --upgrade pip
          - pip install -r requirements.txt

      - step: build@shell
        name: install-playwright
        displayName: 安装 Playwright Chromium
        commands:
          - npx playwright install --with-deps chromium
          - npx playwright --version

      - step: build@shell
        name: run-monitor
        displayName: 运行监控脚本
        commands:
          - python scripts/run_monitor.py || true

      - step: general@artifact
        name: upload-reports
        displayName: 上传测试报告
        inputs:
          artifactName: test-reports
          artifactPath:
            - workspace/test-results/
            - workspace/logs/
          retentionDays: 7
